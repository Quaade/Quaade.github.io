<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Weekly Meal Planner</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f1; --surface:#fcfcfb; --surface-2:#efeee9; --surface-3:#e6e5df;
  --border:rgba(11,11,11,.10); --border-strong:rgba(11,11,11,.20);
  --text:#0b0b0b; --text-2:#52514e; --muted:#898781;
  --accent:#1f7a4d; --accent-ink:#ffffff; --accent-soft:#e2f0e7;
  --fav:#c98500;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b; --good-text:#006300;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --surface-3:#2e2e2b;
    --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.20);
    --text:#ffffff; --text-2:#c3c2b7; --muted:#898781;
    --accent:#3fae74; --accent-ink:#06210f; --accent-soft:#15301f;
    --fav:#eda100;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-text:#0ca30c; --grid:#2c2c2a; --axis:#383835;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --surface-3:#2e2e2b;
  --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.20);
  --text:#ffffff; --text-2:#c3c2b7; --muted:#898781;
  --accent:#3fae74; --accent-ink:#06210f; --accent-soft:#15301f;
  --fav:#eda100;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-text:#0ca30c; --grid:#2c2c2a; --axis:#383835;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px} h3{font-size:15px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--text-2)} .faint{color:var(--muted)} .small{font-size:13px}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.top-inner{max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.brand{font-weight:750;font-size:17px;display:flex;gap:8px;align-items:center;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--text-2);font-weight:600;white-space:nowrap}
.tabs button:hover{color:var(--text);background:var(--surface-2)}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--bg)}
.tab-badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;font-size:11px;line-height:18px;background:var(--accent);color:var(--accent-ink);text-align:center}
main{max-width:1440px;margin:0 auto;padding:16px 16px 60px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:8px}
.icon-btn{border:0;background:transparent;width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;color:var(--text-2);font-size:14px;padding:0;flex:none}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}
.icon-btn[aria-pressed="true"]{color:var(--text)}
input[type=text],input[type=url],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.4}
label.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);font-size:12.5px;color:var(--text-2);white-space:nowrap}
.pill b{color:var(--text);font-weight:650}

/* week bar & toolbar */
.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.weekbar h2{min-width:0;font-size:20px;margin:0 4px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
details.opts{position:relative}
details.opts>summary{list-style:none}
details.opts>summary::-webkit-details-marker{display:none}
.opts-pop{position:absolute;z-index:25;top:calc(100% + 6px);left:0;width:min(340px,calc(100vw - 32px));padding:14px;display:grid;gap:10px}
.opts-pop fieldset{border:0;padding:0;margin:0;display:grid;gap:6px}
.opts-pop legend{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px}

/* planner grid */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.week{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
.day{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0;box-shadow:var(--shadow)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 4px}
.day-name{font-weight:700}
.day-kcal{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot{position:relative;border-radius:10px;background:var(--surface-2);min-height:104px;display:flex;flex-direction:column;border:1px solid transparent;transition:border-color .12s,background .12s}
.slot.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.slot.locked{box-shadow:inset 0 0 0 1px var(--border-strong)}
.slot-top{display:flex;align-items:center;justify-content:space-between;padding:5px 4px 0 9px;min-height:28px}
.slot-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.slot-tools{display:flex;gap:0;opacity:.55;transition:opacity .12s}
.slot:hover .slot-tools,.slot:focus-within .slot-tools,.slot.locked .slot-tools{opacity:1}
@media (hover:none){.slot-tools{opacity:1}}
.slot-tools .icon-btn{width:24px;height:24px;font-size:12.5px}
.slot-main{border:0;background:none;text-align:left;padding:4px 9px 9px;display:flex;gap:8px;align-items:flex-start;flex:1;color:inherit;min-width:0}
.slot-main:hover .slot-name{text-decoration:underline;text-decoration-color:var(--muted)}
.slot-name{font-weight:620;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.slot-meta{font-size:11.5px;color:var(--text-2);margin-top:3px;font-variant-numeric:tabular-nums}
.slot-empty{flex:1;border:1.5px dashed var(--border-strong);border-radius:8px;margin:4px 8px 8px;background:transparent;color:var(--text-2);font-weight:600;font-size:13px}
.slot-empty:hover{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.slot-special{padding:6px 9px 10px;font-weight:600;font-size:13.5px;color:var(--text-2)}
.thumb{position:relative;flex:none;width:40px;height:40px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;overflow:hidden;font-size:21px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb.lg{width:56px;height:56px;font-size:28px;border-radius:10px}
.fav-dot{color:var(--fav)}
.plan-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* recipes */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{flex:1 1 220px}
.lib-status{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.card-img{border:0;padding:0;background:var(--surface-3);aspect-ratio:16/10;position:relative;display:grid;place-items:center;font-size:44px;overflow:hidden}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-title{border:0;background:none;padding:0;text-align:left;font-weight:680;font-size:14.5px;line-height:1.25;color:var(--text)}
.card-title:hover{text-decoration:underline}
.card-meta{font-size:12.5px;color:var(--text-2)}
.card-nut{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto;padding-top:4px}
.star{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:999px;border:0;background:color-mix(in srgb,var(--surface) 88%,transparent);display:grid;place-items:center;font-size:17px;color:var(--muted);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.star[aria-pressed="true"]{color:var(--fav)}
.star.inline{position:static;box-shadow:none;background:var(--surface-2)}
.src-tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:650;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--text-2)}
.more{display:flex;justify-content:center;margin-top:16px}
.empty-state{padding:40px 16px;text-align:center;color:var(--text-2)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
.modal{background:var(--surface);border-radius:18px;width:min(760px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative;margin-bottom:4vh}
.modal.wide{width:min(980px,100%)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px 20px;border-bottom:1px solid var(--border)}
.modal-head h2{flex:1;font-size:18px}
.modal-body{padding:16px 20px 20px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--border)}
.close-x{font-size:18px}
.hero{height:220px;background:var(--surface-3);position:relative;display:grid;place-items:center;font-size:84px;border-radius:18px 18px 0 0;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .close-x{position:absolute;top:10px;right:10px;background:color-mix(in srgb,var(--surface) 90%,transparent);width:34px;height:34px;border-radius:999px}
.detail-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px;margin-top:16px}
@media (max-width:700px){.detail-cols{grid-template-columns:1fr}}
.detail-cols ul,.detail-cols ol{margin:8px 0 0;padding-left:20px}
.detail-cols li{margin:4px 0}
.ing-unk{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.nut-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:12px}
@media (max-width:560px){.nut-row{grid-template-columns:repeat(3,minmax(0,1fr))}}
.nut{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.nut b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.nut span{font-size:11.5px;color:var(--text-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.add-to{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--surface-2);padding:10px;border-radius:12px;margin-top:16px}

/* picker */
.pick-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pick-filters input[type=search]{flex:1 1 200px}
.pick-quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pick-list{display:flex;flex-direction:column;gap:2px;max-height:min(58vh,560px);overflow-y:auto;margin:0 -8px;padding:0 8px}
.pick-row{display:flex;gap:10px;align-items:center;border:0;background:none;text-align:left;padding:7px 8px;border-radius:10px;width:100%;color:inherit}
.pick-row:hover,.pick-row:focus-visible{background:var(--surface-2)}
.pick-row .nm{font-weight:620}
.pick-row .sub{font-size:12px;color:var(--text-2)}
.pick-row .nums{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* form */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:12.5px;font-weight:650;color:var(--text-2)}
.field.full{grid-column:1/-1}
.import-box{background:var(--accent-soft);border-radius:12px;padding:12px;margin-bottom:16px}
.import-box .row input{flex:1 1 260px}
.status{font-size:13px;margin-top:6px;min-height:1em}
.status.err{color:var(--crit)}
.status.ok{color:var(--good-text)}

/* shopping */
.add-item{display:flex;gap:8px;flex-wrap:wrap;padding:12px;margin-bottom:14px}
.add-item input[name=name]{flex:2 1 200px}
.add-item input[name=qty]{flex:0 1 110px}
.shop-cols{columns:3 300px;column-gap:14px}
.aisle{break-inside:avoid;margin-bottom:14px;padding:12px 14px}
.aisle h3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.aisle h3 .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.aisle ul{list-style:none;margin:0;padding:0}
.aisle li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--border)}
.aisle li:first-child{border-top:0}
.aisle li label{display:flex;gap:10px;flex:1;cursor:pointer;min-width:0}
.aisle li input{margin-top:2px;flex:none}
.it-name{font-weight:560}
.it-qty{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text-2);white-space:nowrap;padding-left:8px}
.it-for{font-size:11.5px;color:var(--muted);margin-top:1px}
.aisle li.done .it-name,.aisle li.done .it-qty{text-decoration:line-through;color:var(--muted)}
.tag-extra{font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-left:6px}

/* nutrition */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.tile{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tile-label{font-size:12.5px;font-weight:650;color:var(--text-2)}
.tile-val{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.tile-val small{font-size:14px;font-weight:600;color:var(--text-2);margin-left:2px}
.tile-target{font-size:12px;color:var(--muted)}
.meter{position:relative;height:8px;border-radius:999px;background:var(--surface-3);overflow:visible}
.meter>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--text-2)}
.meter>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:1px}
.status-badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;color:var(--text)}
.status-badge .dot{width:16px;height:16px;border-radius:999px;display:grid;place-items:center;font-size:10px;color:#fff;font-weight:800}
.st-good .dot{background:var(--good)} .st-warn .dot{background:var(--warn);color:#2b1d00} .st-serious .dot{background:var(--serious);color:#2b1000} .st-crit .dot{background:var(--crit)} .st-na .dot{background:var(--muted)}
.nutri-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.nutri-grid{grid-template-columns:1fr}}
.chart-box{padding:14px 16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin:6px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tooltip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:10px;padding:8px 10px;font-size:12.5px;min-width:150px;z-index:5;transform:translate(-50%,-100%);white-space:nowrap}
.tooltip .tt-row{display:flex;gap:10px;justify-content:space-between;font-variant-numeric:tabular-nums}
.tooltip .tt-row span:first-child{color:var(--text-2)}
table.data{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{font-size:11.5px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.04em}
.table-wrap{overflow-x:auto}
.report{padding:16px 18px}
.grade{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.grade-letter{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;font-weight:800;background:var(--surface-3)}
.rec{padding:12px 0;border-top:1px solid var(--border)}
.rec:first-of-type{border-top:0}
.rec h4{margin:0 0 4px;font-size:14.5px;display:flex;gap:8px;align-items:center}
.rec p{margin:0;color:var(--text-2);font-size:13.5px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sugg button{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--text)}
.sugg button:hover{border-color:var(--accent)}
.swap{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--surface-2);padding:8px 10px;border-radius:10px}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.count{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.count b{font-size:18px;display:block}
.count span{font-size:12px;color:var(--text-2)}
.goodlist{margin:6px 0 0;padding-left:0;list-style:none;font-size:13.5px;color:var(--text-2)}
.goodlist li{margin:3px 0}
.goodlist li::before{content:"✓ ";color:var(--good-text);font-weight:800}

/* settings */
.settings{display:grid;gap:14px;max-width:820px}
.settings section{padding:16px 18px;display:grid;gap:12px}
.settings h3{font-size:16px}

/* toast */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:600px){
  main{padding:12px 16px 60px}
  .weekbar h2{font-size:17px}
  .hero{height:170px}
}
@media print{

Object.entries(UNIT_ALIASES).forEach(([u, s]) => (s.includes('|') ? s.split('|') : s.split(' ')).forEach(a => UNIT_MAP[a] = u));
const UNIT_RE = new RegExp('^(' + Object.keys(UNIT_MAP).sort((a, b) => b.length - a.length).map(a => a.replace(/[.]/g, '\\.')).join('|') + ')(?![a-z])\\.?\\s*', 'i');

const METRIC_PAREN = /^\(\s*(?:about\s+)?(\d+(?:[.,]\d+)?)\s*(g|kg|ml|l|oz)\b[^)]*\)\s*/i;
const MASS_UNITS = {g: 1, kg: 1000, oz: 28.35, lb: 453.6};
const VOL_UNITS = {ml: 1, cl: 10, dl: 100, l: 1000, floz: 29.6, tsp: 5, tbsp: 15, cup: 240};
const UNIT_LABEL = {pinch: 'pinch', dash: 'dash', handful: 'handful', bunch: 'bunch', clove: 'clove', can: 'can', jar: 'jar', pack: 'pack', slice: 'slice', sprig: 'sprig', stick: 'stick', knob: 'knob', head: 'head', fillet: 'fillet', rasher: 'rasher', sheet: 'sheet', leaf: 'leaf', piece: 'piece'};

function parseNum(t) {
  t = t.trim().replace(',', '.'); let m;
  if ((m = t.match(/^(\d+)\s+(\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = t.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
  return parseFloat(t);
}

function parseQU(str) {
  let s = String(str).replace(/(\d)?\s*([½⅓⅔¼¾⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])/g, (m, d, f) => ' ' + String(round((d ? +d : 0) + FRAC[f], 3)) + ' ')
    .replace(/⁄/g, '/').replace(/\s+/g, ' ').trim()
    .replace(/^([-–•*·▢□☐]|\d+[.)](?=\s))\s*/, '')
    .replace(/^(\d+(?:[.,]\d+)?)-(?=(ounce|oz|pound|lb|gram|g|kg|ml|litre|liter|inch|cm)\b)/i, '$1 ')
    .replace(/^(about|approx\.?|approximately|around|roughly|scant|heaping|heaped|generous|a few|few)\s+/i, '');

  } else if ((m = s.match(/^(an?|one)\s+/i))) { qty = 1; s = s.slice(m[0].length); }

    s = s.replace(/^(cans?|tins?|jars?|packs?|packets?|bags?|tubs?|pouch(es)?)\s+(of\s+)?/i, '');

const PREP_RE = /\b(finely|roughly|coarsely|thinly|thickly|freshly|lightly|very|chopped|diced|minced|sliced|grated|crushed|peeled|deseeded|seeded|cored|trimmed|halved|quartered|cubed|shredded|julienned|torn|rinsed|drained|washed|beaten|whisked|melted|softened|cooled|room temperature|uncooked|fresh|large|medium|small|big|ripe|boneless|skinless|skin-on|bone-in|organic|free-range|about|approx|packed|good quality|good-quality|plus extra|to serve|for serving)\b/gi;

  s = s.split(/,|;| - | – /)[0];
  s = s.replace(/\b(for|to)\s+(serve|serving|garnish|taste|decorate|dust|dusting|fry|frying|grease|greasing)\b.*$/, '')
       .replace(/\b(optional|plus more|or more|or to taste|as needed|if needed)\b.*$/, '')
       .replace(PREP_RE, ' ').replace(/[*_]/g, ' ').replace(/\s+/g, ' ').trim()

function toGrams(qty, unit, sz, e) {
  const uw = e ? e.w : 100, cup = e ? e.cup : 200;

  if (unit in MASS_UNITS) return qty * MASS_UNITS[unit];

    case 'pinch': return qty * 0.4;

    case 'bunch': return qty * (e && e.grp === 'herb' ? 30 : Math.max(uw, 100));

    case 'jar': return qty * 300;

  const lines = String(text).replace(/\r/g, '').split('\n').map(s => s.trim());
  let name = '';
  const tl = lines.find(l => /^Title:\s*/.test(l)); if (tl) name = tl.replace(/^Title:\s*/, '');
  if (!name) { const h = lines.find(l => /^#\s+/.test(l)); if (h) name = h.replace(/^#+\s*/, ''); }
  const isHead = l => /^(#{1,6}\s*|\*\*)/.test(l) || (l.length < 40 && /:$/.test(l)) || /^[A-Z][A-Za-z ]{2,30}$/.test(l);
  const ingHead = l => /^(#{1,6}\s*)?(\*\*)?\s*ingredients?\b/i.test(l) && l.length < 60;
  const insHead = l => /^(#{1,6}\s*)?(\*\*)?\s*(method|instructions|directions|steps|preparation|how to make( it)?)\b/i.test(l) && l.length < 60;
  const clean = l => l.replace(/^\s*([-*+•▢□☐]|\d+[.)])\s+/, '').replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[*_`]/g, '').replace(/!\[.*$/, '').trim();
  const ings = [], steps = [];
  let i = lines.findIndex(ingHead);
  if (i >= 0) {
    for (let j = i + 1; j < lines.length; j++) {
      const l = lines[j];
      if (insHead(l)) break;
      if (!l) continue;
      if (/^#{1,6}\s/.test(l) && ings.length) { if (/for the|sauce|dressing|topping|marinade/i.test(l)) { ings.push(clean(l.replace(/^#+\s*/, '')) + ':'); continue; } break; }
      const c = clean(l); if (c && c.length < 160 && !/^(ingredients?|metric|imperial|us customary|cups?|serves?.*)$/i.test(c)) ings.push(c);
      if (ings.length > 60) break;
    }
  }
  let k = lines.findIndex((l, idx) => idx > i && insHead(l));
  if (k >= 0) {
    for (let j = k + 1; j < lines.length; j++) {
      const l = lines[j]; if (!l) continue;
      if (/^#{1,6}\s/.test(l) && steps.length && /notes?|nutrition|tips|video|related|you may also/i.test(l)) break;
      if (/^#{1,6}\s/.test(l) && steps.length > 2) break;
      const c = clean(l); if (c) steps.push(c);
      if (steps.length > 40) break;
    }
  }
  if (!ings.length) return null;
  return {name, ingredients: ings, instructions: steps.join('\n'), image: '', servings: 4, url, meals: guessMeals(name), category: '', cuisine: ''};
}
async function importFromUrl(url, onStatus) {
  const attempts = [
    {label: 'direct', url, kind: 'html'},
    {label: 'reader (HTML)', url: 'https://r.jina.ai/' + url, kind: 'html', headers: {'X-Return-Format': 'html'}},
    {label: 'reader (text)', url: 'https://r.jina.ai/' + url, kind: 'text'},
    ...S.settings.proxies.split('\n').map(s => s.trim()).filter(Boolean).map(p => ({
      label: p.replace(/^https?:\/\//, '').split(/[/?]/)[0], kind: 'html',
      url: p.includes('{rawurl}') ? p.replace('{rawurl}', url) : p.includes('{url}') ? p.replace('{url}', encodeURIComponent(url)) : p + encodeURIComponent(url)
    }))
  ];
  for (const a of attempts) {
    onStatus(`Trying ${a.label}…`);
    try {
      const body = await fetchText(a.url, {timeout: a.label === 'direct' ? 6000 : 20000, headers: a.headers});
      if (!body || body.length < 200) continue;
      const looksHtml = /<html|<script|<body|<!doctype/i.test(body.slice(0, 5000)) || /<script[^>]+ld\+json/i.test(body);
      const res = looksHtml ? fromDoc(new DOMParser().parseFromString(body, 'text/html'), url) : fromText(body, url);
      if (res && res.ingredients.length >= 2) { res.url = url; return res; }
    } catch { /* try next */ }
  }
  return null;
}

/* ---------- Nutrition ---------- */
function weekStats(wk) {
  const T = targets();
  const days = [], meals = [];
  for (let d = 0; d < 7; d++) {
    const day = {d, kcal: 0, p: 0, c: 0, f: 0, fb: 0, veg: 0, sug: 0, count: 0};
    for (const m of MEALS) {
      const r = slotRecipe(getSlot(wk, d, m)); if (!r) continue;
      const n = nutr(r); meals.push({d, m, r, n});
      for (const k of ['kcal', 'p', 'c', 'f', 'fb', 'veg', 'sug']) day[k] += n[k];
      day.count++;
    }
    days.push(day);
  }
  const act = days.filter(x => x.count);
  const avg = {};
  for (const k of ['kcal', 'p', 'c', 'f', 'fb', 'veg', 'sug']) avg[k] = act.length ? act.reduce((s, x) => s + x[k], 0) / act.length : 0;
  const macroK = avg.p * 4 + avg.c * 4 + avg.f * 9 || 1;
  const pct = {p: avg.p * 4 / macroK * 100, c: avg.c * 4 / macroK * 100, f: avg.f * 9 / macroK * 100};
  const scale = act.length ? 7 / act.length : 1;
  const c = {
    fish: meals.filter(x => x.n.fish).length, red: meals.filter(x => x.n.red || x.n.proc).length, proc: meals.filter(x => x.n.proc).length,
    redg: meals.reduce((s, x) => s + x.n.redg, 0) * scale, legume: meals.filter(x => x.n.legume).length, wgrain: meals.filter(x => x.n.wgrain).length,
    veg: meals.filter(x => x.n.vegetarian).length, unique: new Set(meals.map(x => x.r.id)).size, planned: meals.length,
    lowcov: meals.filter(x => x.n.coverage < 0.6).length
  };
  // scoring
  const checks = [];
  const add = (key, ok, warn) => checks.push({key, s: ok ? 1 : warn ? 0.5 : 0});
  add('fibre', avg.fb >= T.fibre * 0.9, avg.fb >= T.fibre * 0.6);
  add('protein', avg.p >= T.protein * 0.9, avg.p >= T.protein * 0.65);
  add('veg', avg.veg >= T.veg * 0.9, avg.veg >= T.veg * 0.55);
  add('fat', pct.f <= T.fatHi && pct.f >= T.fatLo, pct.f <= T.fatHi + 7);
  add('sugar', avg.sug <= T.sugar, avg.sug <= T.sugar * 1.6);
  add('fish', c.fish >= 2, c.fish >= 1);
  add('red', c.redg <= T.redMax, c.redg <= T.redMax * 1.5);
  add('legume', c.legume >= 2, c.legume >= 1);
  add('wgrain', c.wgrain >= 5, c.wgrain >= 2);
  const score = checks.reduce((s, x) => s + x.s, 0) / checks.length;
  const grade = !meals.length ? '–' : score >= 0.9 ? 'A' : score >= 0.75 ? 'B' : score >= 0.6 ? 'C' : score >= 0.45 ? 'D' : 'E';
  return {T, days, meals, active: act.length, avg, pct, c, score, grade};
}
function status(level) {
  const map = {good: ['st-good', '✓', 'On track'], low: ['st-warn', '▼', 'Low'], vlow: ['st-crit', '▼', 'Very low'], high: ['st-serious', '▲', 'High'], vhigh: ['st-crit', '▲', 'Too high'], na: ['st-na', '–', 'No data']};
  const [c, i, l] = map[level];
  return `<span class="status-badge ${c}"><span class="dot" aria-hidden="true">${i}</span>${l}</span>`;
}
function tile(label, val, unit, targetText, frac, targetFrac, level) {
  return `<div class="tile panel"><div class="tile-label">${label}</div>
    <div class="tile-val">${val}<small>${unit}</small></div>
    <div class="meter" role="img" aria-label="${label}: ${val}${unit}, ${targetText}"><i style="width:${Math.max(0, Math.min(100, frac * 100))}%"></i>${targetFrac != null ? `<b style="left:calc(${Math.min(100, targetFrac * 100)}% - 1px)"></b>` : ''}</div>
    <div class="row" style="justify-content:space-between"><span class="tile-target">${targetText}</span>${status(level)}</div></div>`;
}
function lvlMin(v, t) { return v >= t * 0.9 ? 'good' : v >= t * 0.6 ? 'low' : 'vlow'; }
function lvlMax(v, t) { return v <= t ? 'good' : v <= t * 1.5 ? 'high' : 'vhigh'; }
function suggestions(metric, mealTypes, wk, k = 4) {
  const inWeek = new Set(); eachSlot((d, m) => { const s = getSlot(wk, d, m); if (s) inWeek.add(s.id); });
  const f = {
    fibre: n => n.fb, protein: n => n.p, veg: n => n.veg, fish: n => n.fish ? 1 + n.veg / 500 : -1, legume: n => n.legume ? n.fb : -1,
    wgrain: n => n.wgrain ? n.fb : -1, lowred: n => n.vegetarian ? n.p + n.fb : -1, lowfat: n => n.kcal ? -n.f * 9 / n.kcal + n.p / 100 : -1, lowsugar: n => n.sug < 8 ? n.fb : -1
  }[metric];
  return ALL.filter(r => !inWeek.has(r.id) && (r.meals || []).some(m => mealTypes.includes(m)) && nutr(r).coverage >= 0.6 && f(nutr(r)) > 0)
    .map(r => ({r, s: f(nutr(r)) * (isFav(r.id) ? 1.3 : 1) * (0.85 + Math.random() * 0.3)}))
    .sort((a, b) => b.s - a.s).slice(0, k).map(x => x.r);
}
function swapIdea(st, metric, label, unit) {
  const val = n => metric === 'fibre' ? n.fb : metric === 'protein' ? n.p : n.veg;
  const cands = st.meals.slice().sort((a, b) => val(a.n) - val(b.n));
  const worst = cands[0]; if (!worst) return '';
  const best = suggestions(metric, [worst.m], S.week, 6).find(r => val(nutr(r)) > val(worst.n) * 1.6 + 2);
  if (!best) return '';
  return `<div class="swap"><span>Swap <b>${DAY_NAMES[worst.d]} ${MEAL_LABEL[worst.m].toLowerCase()}</b>: ${esc(worst.r.name)} (${Math.round(val(worst.n))} ${unit} ${label}) → <b>${esc(best.name)}</b> (${Math.round(val(nutr(best)))} ${unit})</span>
    <button class="btn sm" data-act="swap" data-d="${worst.d}" data-m="${worst.m}" data-id="${esc(best.id)}">Swap it</button></div>`;
}
function suggChips(list) { return list.length ? `<div class="sugg">${list.map(r => `<button data-act="open" data-id="${esc(r.id)}">${esc(r.emoji || '')} ${esc(r.name)}</button>`).join('')}</div>` : ''; }
function renderNutrition() {
  const st = weekStats(S.week), T = st.T, a = st.avg, c = st.c;
  if (!st.meals.length) {
    app.innerHTML = `${weekBar()}<div class="empty-state panel">Nothing planned this week yet — add some meals and a nutrition report appears here.<br><br><button class="btn primary" data-act="tab" data-tab="plan">Go to the planner</button></div>`;
    return;
  }
  const recs = [], goods = [];
  const kcalShare = a.kcal / T.kcal;
  if (st.c.planned < 21) recs.push({lvl: 'na', title: `${21 - st.c.planned} meal slot${21 - st.c.planned === 1 ? '' : 's'} still empty`, text: `Daily figures are averaged over the ${st.active} day${st.active === 1 ? '' : 's'} with at least one meal, so empty slots make days look lighter than they will be. Fill them (🎲 Fill empty slots) for a complete picture.`});
  if (kcalShare < 0.7) recs.push({lvl: 'low', title: 'Meals look light on energy', text: `Your planned meals average ${fmtInt(a.kcal)} kcal a day against a ${fmtInt(T.kcal)} kcal target. Snacks usually supply 10–20% of intake, but this gap is larger — consider bigger portions, adding a side (bread, rice, potatoes), or a more substantial breakfast.`});
  else if (kcalShare > 1.05) recs.push({lvl: 'high', title: 'Meals alone exceed your energy target', text: `Meals average ${fmtInt(a.kcal)} kcal a day, above your ${fmtInt(T.kcal)} kcal target before any snacks or drinks. Lighter lunches, smaller portions of the richest dinners, or more vegetable-heavy dishes would bring this down.`, sugg: suggestions('lowfat', ['lunch', 'dinner'], S.week)});
  else goods.push(`Energy is in a sensible range (${fmtInt(a.kcal)} kcal/day from meals, leaving room for snacks).`);
  if (a.fb < T.fibre * 0.9) recs.push({lvl: a.fb < T.fibre * 0.6 ? 'vlow' : 'low', title: 'Fibre is below target', text: `You're averaging ${Math.round(a.fb)} g of fibre a day against the ${T.fibre} g most adults need. Fibre supports digestion, blood sugar and heart health. Easy wins: swap white rice/pasta/bread for whole-grain versions, add a tin of beans or lentils to a stew or salad, and start the day with oats.`, sugg: suggestions('fibre', ['breakfast', 'lunch', 'dinner'], S.week), swap: swapIdea(st, 'fibre', 'fibre', 'g')});
  else goods.push(`Plenty of fibre (${Math.round(a.fb)} g/day).`);
  if (a.p < T.protein * 0.9) recs.push({lvl: a.p < T.protein * 0.65 ? 'vlow' : 'low', title: 'Protein could be higher', text: `Meals provide about ${Math.round(a.p)} g protein a day; aim for roughly ${T.protein} g. Include a palm-sized portion of fish, poultry, eggs, tofu, beans or Greek yogurt in every meal — breakfast is often the easiest place to add some.`, sugg: suggestions('protein', ['breakfast', 'lunch', 'dinner'], S.week), swap: swapIdea(st, 'protein', 'protein', 'g')});
  else goods.push(`Protein target met (${Math.round(a.p)} g/day).`);
  if (a.veg < T.veg * 0.9) recs.push({lvl: a.veg < T.veg * 0.55 ? 'vlow' : 'low', title: 'More fruit and vegetables needed', text: `Meals contain roughly ${Math.round(a.veg)} g of fruit and veg a day — the guideline is at least ${T.veg} g (five 80 g portions). Add a side salad or steamed greens to dinners, fruit to breakfast, and extra veg to sauces and soups.`, sugg: suggestions('veg', ['lunch', 'dinner'], S.week), swap: swapIdea(st, 'veg', 'fruit & veg', 'g')});
  else goods.push(`Good fruit & veg intake (${Math.round(a.veg)} g/day).`);
  if (c.fish < 2) recs.push({lvl: c.fish === 0 ? 'vlow' : 'low', title: `Only ${c.fish} fish meal${c.fish === 1 ? '' : 's'} this week`, text: 'Guidelines suggest two portions of fish a week, one of them oily (salmon, mackerel, sardines, trout) for omega-3 fats.', sugg: suggestions('fish', ['lunch', 'dinner'], S.week)});
  else goods.push(`${c.fish} fish meals — meets the two-a-week guideline.`);
  if (c.redg > T.redMax) recs.push({lvl: c.redg > T.redMax * 1.5 ? 'vhigh' : 'high', title: 'Red & processed meat is on the high side', text: `About ${Math.round(c.redg)} g per person this week across ${c.red} meal${c.red === 1 ? '' : 's'}${c.proc ? ` (${c.proc} with processed meat)` : ''}. Keeping red meat under ~350–500 g a week and processed meat to a minimum lowers bowel-cancer risk. Try swapping one or two for fish, poultry or a bean-based dish.`, sugg: suggestions('lowred', ['dinner'], S.week)});
  else if (c.red) goods.push(`Red meat kept moderate (${Math.round(c.redg)} g/person this week).`);
  if (c.legume < 2) recs.push({lvl: 'low', title: 'Add beans, lentils or chickpeas', text: `Only ${c.legume} meal${c.legume === 1 ? '' : 's'} feature legumes. They're cheap, high in fibre and protein, and count towards your veg — aim for at least two or three meals a week.`, sugg: suggestions('legume', ['lunch', 'dinner'], S.week)});
  else goods.push(`${c.legume} meals with beans, lentils or chickpeas.`);

  else goods.push(`Whole grains in ${c.wgrain} meals.`);
  if (st.pct.f > T.fatHi) recs.push({lvl: st.pct.f > T.fatHi + 7 ? 'vhigh' : 'high', title: 'Fat makes up a large share of energy', text: `${Math.round(st.pct.f)}% of calories come from fat (guideline 20–35%). Swap cream for yogurt or crème fraîche, measure oil rather than pouring, and pick leaner cuts and lower-fat cheeses.`, sugg: suggestions('lowfat', ['lunch', 'dinner'], S.week)});
  else if (st.pct.f < T.fatLo) recs.push({lvl: 'low', title: 'Very low in fat', text: `Only ${Math.round(st.pct.f)}% of energy is from fat. Some healthy fats help you absorb vitamins A, D, E and K — add olive oil, nuts, seeds, avocado or oily fish.`});
  else goods.push(`Balanced fat (${Math.round(st.pct.f)}% of energy).`);
  if (a.sug > T.sugar) recs.push({lvl: a.sug > T.sugar * 1.6 ? 'vhigh' : 'high', title: 'Added sugar is high', text: `Roughly ${Math.round(a.sug)} g of added sugar a day from recipes (sugar, honey, syrups, chocolate, jam) — the recommended maximum is ${T.sugar} g. Cut syrup toppings, use fruit for sweetness, and check sauces.`, sugg: suggestions('lowsugar', ['breakfast'], S.week)});
  const repeats = [...st.meals.reduce((mp, x) => mp.set(x.r.name, (mp.get(x.r.name) || 0) + 1), new Map())].filter(([, n]) => n >= 3);
  if (repeats.length) recs.push({lvl: 'na', title: 'Low variety', text: `${repeats.map(([n, k]) => `${esc(n)} appears ${k}×`).join('; ')}. Eating a wider range of foods covers more vitamins and minerals.`});
  else if (c.unique >= Math.min(12, c.planned)) goods.push(`Good variety — ${c.unique} different recipes.`);
  if (c.lowcov) recs.push({lvl: 'na', title: 'Some estimates are rough', text: `${c.lowcov} meal${c.lowcov === 1 ? ' has' : 's have'} several ingredients the estimator didn't recognise, so their nutrition may be understated.`});
  const lvlIcon = l => ({good: ['st-good', '✓'], low: ['st-warn', '!'], vlow: ['st-crit', '!'], high: ['st-serious', '!'], vhigh: ['st-crit', '!'], na: ['st-na', 'i']}[l]);
  const intro = {A: 'An excellent, well-balanced week.', B: 'A solid week with a couple of things to tweak.', C: 'A reasonable base, but several areas could be improved.', D: 'This week is missing some important food groups.', E: 'This plan needs rebalancing — see the suggestions below.'}[st.grade] || '';

  app.innerHTML = `${weekBar()}

    ${tile('Protein', Math.round(a.p), ' g', `target ≥ ${T.protein} g`, a.p / (T.protein * 1.5), 1 / 1.5, lvlMin(a.p, T.protein))}
    ${tile('Fibre', Math.round(a.fb), ' g', `target ≥ ${T.fibre} g`, a.fb / (T.fibre * 1.5), 1 / 1.5, lvlMin(a.fb, T.fibre))}
    ${tile('Fruit & veg', Math.round(a.veg), ' g', `target ≥ ${T.veg} g`, a.veg / (T.veg * 1.5), 1 / 1.5, lvlMin(a.veg, T.veg))}
    ${tile('Fat', Math.round(st.pct.f), '% kcal', 'target 20–35% of energy', st.pct.f / 50, 35 / 50, st.pct.f > T.fatHi + 7 ? 'vhigh' : st.pct.f > T.fatHi ? 'high' : st.pct.f < T.fatLo ? 'low' : 'good')}
    ${tile('Added sugar', Math.round(a.sug), ' g', `limit ≤ ${T.sugar} g`, a.sug / (T.sugar * 2), 0.5, lvlMax(a.sug, T.sugar))}

  <div class="nutri-grid">

        ${recs.map(r => { const [cls, ic] = lvlIcon(r.lvl); return `<div class="rec"><h4><span class="status-badge ${cls}"><span class="dot" aria-hidden="true">${ic}</span></span>${esc(r.title)}</h4><p>${r.text}</p>${r.swap || ''}${r.sugg ? suggChips(r.sugg) : ''}</div>`; }).join('')}
        ${goods.length ? `<div class="rec"><h4>What's working</h4><ul class="goodlist">${goods.map(g => `<li>${esc(g)}</li>`).join('')}</ul></div>` : ''}

        ${st.days.map(d => `<tr><td>${DAY_NAMES[d.d].slice(0, 3)}</td><td>${d.count}</td><td>${d.count ? fmtInt(d.kcal) : '–'}</td><td>${d.count ? Math.round(d.p) + ' g' : '–'}</td><td>${d.count ? Math.round(d.c) + ' g' : '–'}</td><td>${d.count ? Math.round(d.f) + ' g' : '–'}</td><td>${d.count ? Math.round(d.fb) + ' g' : '–'}</td><td>${d.count ? Math.round(d.veg) + ' g' : '–'}</td></tr>`).join('')}
        </tbody></table></div>
      </section>
    </div>
  </div>`;
  drawChart(st);
}
function drawChart(st) {
  const el = $('#chart'); if (!el) return;
  const W = Math.max(280, el.clientWidth), H = 230, m = {l: 40, r: 8, t: 14, b: 26};
  const T = st.T.kcal;
  const maxV = Math.max(T * 1.1, ...st.days.map(d => d.p * 4 + d.c * 4 + d.f * 9));
  const step = maxV > 3000 ? 1000 : 500, top = Math.ceil(maxV / step) * step;
  const ih = H - m.t - m.b, iw = W - m.l - m.r, band = iw / 7, bw = Math.min(40, band * 0.56);
  const y = v => m.t + ih * (1 - v / top);
  let svg = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Stacked bar chart of daily calories from protein, carbs and fat">`;
  for (let v = 0; v <= top; v += step) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(${v === 0 ? '--axis' : '--grid'})" stroke-width="1"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${v ? (v / 1000) + 'k' : 0}</text>`;
  st.days.forEach((d, i) => {
    const cx = m.l + band * i + band / 2, x = cx - bw / 2;
    const segs = [['p', d.p * 4, '--s1'], ['c', d.c * 4, '--s2'], ['f', d.f * 9, '--s3']].filter(s => s[1] > 0);
    let cum = 0;
    segs.forEach(([k, v, col], j) => {
      const y1 = y(cum + v), y0 = y(cum) - (j > 0 ? 2 : 0), h = Math.max(0, y0 - y1);
      if (j === segs.length - 1) {
        const r = Math.min(4, h, bw / 2);
        svg += `<path d="M${x},${y0} V${y1 + r} Q${x},${y1} ${x + r},${y1} H${x + bw - r} Q${x + bw},${y1} ${x + bw},${y1 + r} V${y0} Z" fill="var(${col})"/>`;
      } else svg += `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" fill="var(${col})"/>`;
      cum += v;
    });
    svg += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="11.5" fill="var(--text-2)">${DAY_NAMES[i].slice(0, 3)}</text>`;
    svg += `<rect x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}" fill="transparent" data-i="${i}" class="hit"/>`;
  });
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(T)}" y2="${y(T)}" stroke="var(--text-2)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  svg += `<text x="${W - m.r}" y="${y(T) - 5}" text-anchor="end" font-size="11" fill="var(--text-2)">target ${fmtInt(T)}</text></svg>`;
  el.innerHTML = svg + '<div class="tooltip hidden" id="tt"></div>';
  const tt = $('#tt', el);
  $$('.hit', el).forEach(h => {
    const show = () => {
      const d = st.days[+h.dataset.i];
      const box = el.getBoundingClientRect(), hb = h.getBoundingClientRect();
      tt.innerHTML = `<b>${DAY_NAMES[d.d]}</b>${d.count ? `<div class="tt-row"><span>Total</span><b>${fmtInt(d.kcal)} kcal</b></div><div class="tt-row"><span>Protein</span><span>${Math.round(d.p)} g · ${fmtInt(d.p * 4)} kcal</span></div><div class="tt-row"><span>Carbs</span><span>${Math.round(d.c)} g · ${fmtInt(d.c * 4)} kcal</span></div><div class="tt-row"><span>Fat</span><span>${Math.round(d.f)} g · ${fmtInt(d.f * 9)} kcal</span></div><div class="tt-row"><span>Meals</span><span>${d.count}/3</span></div>` : '<div class="faint">No meals planned</div>'}`;
      tt.classList.remove('hidden');
      const left = Math.min(Math.max(hb.left - box.left + hb.width / 2, 80), box.width - 80);
      tt.style.left = left + 'px'; tt.style.top = (m.t + 4) + 'px';
      h.setAttribute('fill', 'color-mix(in srgb, var(--text) 5%, transparent)');
    };
    const hide = () => { tt.classList.add('hidden'); h.setAttribute('fill', 'transparent'); };
    h.addEventListener('mouseenter', show); h.addEventListener('mouseleave', hide);
    h.addEventListener('touchstart', show, {passive: true});
  });
}

let lastFocus = null;
function openModal(html, {wide} = {}) {
  lastFocus = document.activeElement;
  $('#modal-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div></div>`;
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  $('#modal-root').innerHTML = ''; document.body.style.overflow = ''; S.pick = null;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

  'slot-rnd': el => { const s = el.closest('.slot'); randomize('one', {d: +s.dataset.day, m: s.dataset.meal}); },

  },

    if (!confirm(`Clear this week's plan${locked.length ? ' (locked meals are kept)' : ''}?`)) return;

  'shop-clear-extras': () => { S.extras = S.extras.filter(x => !x.done); save.extras(); render(); },
  export: () => {
    const data = {app: 'meal-planner', version: 1, exported: new Date().toISOString(), settings: S.settings, user: S.user, favs: [...S.favs], plan: S.plan, extras: S.extras, checked: S.checked};
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], {type: 'application/json'}));
    a.download = `meal-planner-backup-${isoDate(new Date())}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  reset: () => {
    if (!confirm('Delete all your recipes, favourites, plans and settings from this browser?')) return;
    Object.keys(localStorage).filter(k => k.startsWith('mp_')).forEach(k => localStorage.removeItem(k));
    location.reload();
  }
};

document.addEventListener('click', ev => {
  const tabBtn = ev.target.closest('#tabs button'); if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'INPUT') { fn(el, ev); return; }
  if (el.dataset.act !== 'overlay') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });

let searchTimer;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'lib-q') { clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.ui.q = t.value; S.ui.limit = 60; const pos = t.selectionStart; render(); const n = $('#lib-q'); n.focus(); n.setSelectionRange(pos, pos); }, 180); }
  else if (t.id === 'pick-q') { S.pick.q = t.value; S.pick.limit = 120; renderPickList(); }
  else if (t.closest('#rform') && (t.name === 'ingredients' || t.name === 'servings')) { clearTimeout(searchTimer); searchTimer = setTimeout(updateIngPreview, 250); }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'pick-fav') { S.pick.fav = t.checked; renderPickList(); return; }
  if (t.id === 'pick-any') { S.pick.any = t.checked; renderPickList(); return; }
  if (t.dataset.ui) { S.ui[t.dataset.ui] = t.type === 'checkbox' ? t.checked : t.value; S.ui.limit = 60; render(); return; }
  if (t.dataset.rnd) { S.settings.rnd[t.dataset.rnd] = t.type === 'checkbox' ? t.checked : t.value; save.settings(); return; }
  if (t.dataset.rndMeal) { S.settings.rnd.meals[t.dataset.rndMeal] = t.checked; save.settings(); return; }
  if (t.dataset.set) {
    const k = t.dataset.set;
    S.settings[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? (t.value === '' ? 0 : +t.value) : t.value;
    if (k === 'people') S.settings.people = Math.max(1, Math.min(20, +t.value || 1));
    save.settings();
    if (k === 'theme') applyTheme();
    if (S.tab !== 'settings') render();
    return;
  }
  if (t.id === 'import-file' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const d = JSON.parse(rd.result);
        if (d.app !== 'meal-planner') throw new Error('not a backup');
        if (!confirm('Replace your current data with this backup?')) return;
        S.settings = {...DEFAULT_SETTINGS, ...d.settings, rnd: {...DEFAULT_SETTINGS.rnd, ...(d.settings?.rnd || {})}};
        S.user = d.user || []; S.favs = new Set(d.favs || []); S.plan = d.plan || {}; S.extras = d.extras || []; S.checked = d.checked || {};
        Object.values(save).forEach(f => f()); reindex(); applyTheme(); render(); toast('Backup imported');
      } catch { toast('That file isn\'t a valid Meal Planner backup.'); }
    };
    rd.readAsText(t.files[0]);
  }
});
document.addEventListener('submit', ev => {
  if (ev.target.id === 'add-item') {
    ev.preventDefault();
    const fd = new FormData(ev.target), name = String(fd.get('name')).trim(); if (!name) return;
    S.extras.push({id: uid('x-'), name, qty: String(fd.get('qty') || '').trim(), aisle: fd.get('aisle'), done: false});
    save.extras(); render(); $('#add-item [name=name]')?.focus();
  } else if (ev.target.id === 'rform') { ev.preventDefault(); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'imp-url') { ev.preventDefault(); $('[data-act="imp-fetch"]')?.click(); } });

// drag & drop between slots
let dragFrom = null;
document.addEventListener('dragstart', ev => { const s = ev.target.closest?.('.slot[draggable="true"]'); if (!s) return; dragFrom = {d: +s.dataset.day, m: s.dataset.meal}; ev.dataTransfer.effectAllowed = 'move'; ev.dataTransfer.setData('text/plain', ''); });
document.addEventListener('dragover', ev => { const s = ev.target.closest?.('.slot'); if (!s || !dragFrom) return; ev.preventDefault(); $$('.slot.drag-over').forEach(x => x !== s && x.classList.remove('drag-over')); s.classList.add('drag-over'); });
document.addEventListener('dragleave', ev => { const s = ev.target.closest?.('.slot'); if (s && !s.contains(ev.relatedTarget)) s.classList.remove('drag-over'); });
document.addEventListener('drop', ev => {
  const s = ev.target.closest?.('.slot'); if (!s || !dragFrom) return; ev.preventDefault();
  const to = {d: +s.dataset.day, m: s.dataset.meal};
  const a = getSlot(S.week, dragFrom.d, dragFrom.m), b = getSlot(S.week, to.d, to.m);
  setSlot(S.week, to.d, to.m, a); setSlot(S.week, dragFrom.d, dragFrom.m, b);
  dragFrom = null; render();
});
document.addEventListener('dragend', () => { dragFrom = null; $$('.slot.drag-over').forEach(x => x.classList.remove('drag-over')); });

// close the randomizer options popover when clicking elsewhere
document.addEventListener('click', ev => { $$('details.opts[open]').forEach(d => { if (!d.contains(ev.target)) d.open = false; }); }, true);

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.tab === 'nutrition') drawChart(weekStats(S.week)); }, 150); });

/* =====================================================================
   Boot
   ===================================================================== */
applyTheme();
reindex();
render();
if (!S.settings.onlineTried && !S.online.length) loadMealDB(true);
</script>
</body>
</html>
